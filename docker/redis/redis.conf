# Redis configuration for WordPress object caching

# Network
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (minimal for development)
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice
logfile ""

# Performance
databases 16
tcp-backlog 511

# Security (development only - no auth)
protected-mode no

# Append only file (disabled for development performance)
appendonly no

# LUA scripting
lua-time-limit 5000

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Hash configuration for WordPress compatibility
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List configuration
list-max-ziplist-size -2
list-compress-depth 0

# Set configuration
set-max-intset-entries 512

# Sorted set configuration
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# String configuration for WordPress
hll-sparse-max-bytes 3000

# Active rehashing
activerehashing yes

# Client queries
hz 10

# Dynamic HZ
dynamic-hz yes 